# TYPE  DATABASE  USER  ADDRESS         METHOD
# Allow local (unix socket) connections without SSL (for healthchecks, init scripts).
local   all       all                   trust
# Allow non-SSL TCP inside the private Docker networks that Dublyo (and
# most container hosts) allocate. Same-server containers on the shared
# `dublyo-public` bridge talk over these ranges; requiring SSL there
# only creates surprise BYODB failures with no security gain because
# traffic never leaves the host's virtual switch. Password auth still
# required.
host    all       all   172.16.0.0/12   scram-sha-256
host    all       all   10.0.0.0/8      scram-sha-256
host    all       all   192.168.0.0/16  scram-sha-256
# Everything else: SSL required, password auth.
hostssl all       all   0.0.0.0/0       scram-sha-256
hostssl all       all   ::/0            scram-sha-256
# Reject any remaining non-SSL TCP from the public internet.
host    all       all   0.0.0.0/0       reject
host    all       all   ::/0            reject
